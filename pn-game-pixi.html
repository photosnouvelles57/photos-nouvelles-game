<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Loup Nocturne — Chaperon Rouge</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #03030a; font-family: Inter, system-ui, sans-serif; }
    #game { width: 100%; height: 100%; touch-action: none; }

    #hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 12px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.5));
    }
    .top {
      display: flex; justify-content: space-between; gap: 10px;
      color: #eef3ff;
      text-shadow: 0 0 14px rgba(120, 170, 255, .5);
      font-weight: 700; letter-spacing: .3px;
    }
    .badge {
      pointer-events: none;
      background: linear-gradient(145deg, rgba(16,26,55,.72), rgba(6,12,30,.55));
      border: 1px solid rgba(167,200,255,.24);
      border-radius: 14px;
      padding: 8px 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: clamp(12px, 2vw, 16px);
    }
    #message {
      align-self: center;
      margin-bottom: 125px;
      text-align: center;
      line-height: 1.35;
      max-width: min(92vw, 560px);
      opacity: .95;
    }

    .controls {
      position: fixed; left: 0; right: 0; bottom: 10px;
      display: flex; justify-content: space-between; align-items: end;
      padding: 0 12px; pointer-events: none; z-index: 8;
    }
    .pad {
      pointer-events: auto;
      width: 132px; height: 132px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(143,182,255,.24), rgba(30,50,90,.3));
      border: 1px solid rgba(167,200,255,.28);
      backdrop-filter: blur(6px);
      touch-action: none;
      position: relative;
    }
    .stick {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 54px; height: 54px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(240,250,255,.9), rgba(120,150,230,.6));
      box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 -4px 12px rgba(0,20,80,.35);
    }
    .action {
      pointer-events: auto;
      width: 84px; height: 84px; border-radius: 50%;
      border: 1px solid rgba(255,160,180,.45);
      background: radial-gradient(circle at 35% 30%, rgba(255,120,140,.85), rgba(140,45,60,.75));
      color: #fff; font-size: 16px; font-weight: 800; letter-spacing: .4px;
      text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(0,0,0,.35);
      touch-action: none;
    }

    #hint {
      position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
      color: rgba(235,242,255,.74); font-size: 12px; z-index: 6; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="top">
      <div class="badge" id="dist">Distance: -- m</div>
      <div class="badge" id="speed">Vitesse: -- km/h</div>
      <div class="badge" id="timer">Temps: 0.0s</div>
    </div>
    <div class="badge" id="message">Chasse la fille au chaperon rouge dans la forêt enchantée.</div>
  </div>

  <div class="controls">
    <div class="pad" id="pad"><div class="stick" id="stick"></div></div>
    <button class="action" id="boost">Sprint</button>
  </div>
  <div id="hint">Joystick = direction · Sprint = accélération · Attrape-la !</div>
  <div id="startScreen" style="position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:radial-gradient(circle at center, rgba(6,12,28,.6), rgba(2,4,10,.94));">
    <button id="startBtn" class="badge" style="pointer-events:auto;cursor:pointer;font-size:18px;padding:14px 20px;">▶ Jouer maintenant</button>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.162.0/build/three.module.js';

    const canvas = document.getElementById('game');
    const distEl = document.getElementById('dist');
    const speedEl = document.getElementById('speed');
    const timerEl = document.getElementById('timer');
    const msgEl = document.getElementById('message');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');

    if (!window.WebGLRenderingContext) {
      msgEl.textContent = 'WebGL non supporté sur cet appareil.';
    }

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x06101f, 0.029);

    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 260);
    camera.position.set(0, 4.6, 8.6);

    // Lumières
    const moon = new THREE.DirectionalLight(0x9bc5ff, 1.1);
    moon.position.set(-35, 45, -20);
    moon.castShadow = true;
    moon.shadow.mapSize.set(1024, 1024);
    moon.shadow.camera.near = 5;
    moon.shadow.camera.far = 150;
    moon.shadow.camera.left = -40;
    moon.shadow.camera.right = 40;
    moon.shadow.camera.top = 40;
    moon.shadow.camera.bottom = -40;
    scene.add(moon);

    const hemi = new THREE.HemisphereLight(0x4766a2, 0x0b1322, 0.65);
    scene.add(hemi);

    const wolfAura = new THREE.PointLight(0x89b3ff, 0.8, 12, 2.4);
    wolfAura.position.set(0, 1.8, 0);
    scene.add(wolfAura);

    // Sol forêt
    const groundGeo = new THREE.PlaneGeometry(240, 240, 100, 100);
    const pos = groundGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const n = Math.sin(x * 0.09) * 0.35 + Math.cos(y * 0.08) * 0.35 + Math.sin((x + y) * 0.05) * 0.25;
      pos.setZ(i, n);
    }
    groundGeo.computeVertexNormals();
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x0f1f20, roughness: 0.94, metalness: 0.03 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Etoiles
    const starGeo = new THREE.BufferGeometry();
    const starCount = 900;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 60 + Math.random() * 100;
      const a = Math.random() * Math.PI * 2;
      const h = 18 + Math.random() * 42;
      starPos[i * 3] = Math.cos(a) * r;
      starPos[i * 3 + 1] = h;
      starPos[i * 3 + 2] = Math.sin(a) * r;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xc9ddff, size: 0.23, transparent: true, opacity: 0.85 }));
    scene.add(stars);

    // Arbres stylisés (instancing mobile friendly)
    const treeCount = 340;
    const trunkGeo = new THREE.CylinderGeometry(0.12, 0.22, 2.2, 6);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2f2219, roughness: 1 });
    const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, treeCount);
    trunks.castShadow = true;
    trunks.receiveShadow = true;

    const leafGeo = new THREE.ConeGeometry(1.05, 2.6, 8);
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x1e4d36, roughness: 0.95 });
    const leaves = new THREE.InstancedMesh(leafGeo, leafMat, treeCount);
    leaves.castShadow = true;

    const tmp = new THREE.Object3D();
    const clearRadius = 8;
    for (let i = 0; i < treeCount; i++) {
      let x, z;
      do {
        x = (Math.random() - 0.5) * 220;
        z = (Math.random() - 0.5) * 220;
      } while (Math.hypot(x, z) < clearRadius);
      const s = 0.75 + Math.random() * 0.85;
      tmp.position.set(x, 1.1 * s, z);
      tmp.scale.setScalar(s);
      tmp.rotation.y = Math.random() * Math.PI;
      tmp.updateMatrix();
      trunks.setMatrixAt(i, tmp.matrix);
      tmp.position.set(x, 3.1 * s, z);
      tmp.updateMatrix();
      leaves.setMatrixAt(i, tmp.matrix);
    }
    scene.add(trunks, leaves);

    // Brouillard magique (lucioles)
    const fireflies = [];
    for (let i = 0; i < 45; i++) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.08 + Math.random() * 0.05, 8, 8),
        new THREE.MeshBasicMaterial({ color: i % 3 ? 0x96c6ff : 0xffe58a })
      );
      m.position.set((Math.random() - 0.5) * 60, 0.8 + Math.random() * 3, (Math.random() - 0.5) * 60);
      m.userData = { phase: Math.random() * Math.PI * 2, speed: 0.3 + Math.random() * 0.5, drift: 0.2 + Math.random() * 0.4 };
      fireflies.push(m);
      scene.add(m);
    }

    // Personnages low-poly
    function buildWolf() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.45, 1.3, 8, 12), new THREE.MeshStandardMaterial({ color: 0x5f687b, roughness: 0.8 }));
      body.castShadow = true;
      g.add(body);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.5, 0.8), new THREE.MeshStandardMaterial({ color: 0x6d7384 }));
      head.position.set(0, 1, 0.42);
      head.castShadow = true;
      g.add(head);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xaad4ff });
      const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), eyeMat);
      const e2 = e1.clone();
      e1.position.set(-0.16, 1.02, 0.79);
      e2.position.set(0.16, 1.02, 0.79);
      g.add(e1, e2);
      return g;
    }

    function buildGirl() {
      const g = new THREE.Group();
      const robe = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.25, 10), new THREE.MeshStandardMaterial({ color: 0xa30f20, roughness: 0.8 }));
      robe.position.y = 0.63;
      robe.castShadow = true;
      g.add(robe);
      const hood = new THREE.Mesh(new THREE.SphereGeometry(0.31, 14, 12), new THREE.MeshStandardMaterial({ color: 0xc71e33 }));
      hood.position.set(0, 1.35, 0.02);
      hood.castShadow = true;
      g.add(hood);
      const face = new THREE.Mesh(new THREE.SphereGeometry(0.18, 10, 8), new THREE.MeshStandardMaterial({ color: 0xf2c6a3 }));
      face.position.set(0, 1.31, 0.18);
      g.add(face);
      return g;
    }

    const wolf = buildWolf();
    wolf.position.set(0, 0.86, 0);
    scene.add(wolf);

    const girl = buildGirl();
    girl.position.set(0, 0, -18);
    scene.add(girl);

    // Contrôles (touch + clavier)
    const input = { x: 0, y: 0, boost: false };
    const keys = {};
    addEventListener('keydown', e => { keys[e.code] = true; });
    addEventListener('keyup', e => { keys[e.code] = false; });

    const pad = document.getElementById('pad');
    const stick = document.getElementById('stick');
    let padTouch = null;

    function updateStick(dx, dy) {
      const max = 44;
      const len = Math.hypot(dx, dy);
      const k = len > max ? max / len : 1;
      const sx = dx * k;
      const sy = dy * k;
      stick.style.transform = `translate(calc(-50% + ${sx}px), calc(-50% + ${sy}px))`;
      input.x = sx / max;
      input.y = sy / max;
    }

    pad.addEventListener('pointerdown', e => {
      pad.setPointerCapture(e.pointerId);
      padTouch = e.pointerId;
      const r = pad.getBoundingClientRect();
      updateStick(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
    });
    pad.addEventListener('pointermove', e => {
      if (e.pointerId !== padTouch) return;
      const r = pad.getBoundingClientRect();
      updateStick(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
    });
    function resetPad(e) {
      if (e.pointerId !== padTouch) return;
      padTouch = null;
      input.x = 0; input.y = 0;
      stick.style.transform = 'translate(-50%, -50%)';
    }
    pad.addEventListener('pointerup', resetPad);
    pad.addEventListener('pointercancel', resetPad);

    const boostBtn = document.getElementById('boost');
    ['pointerdown','pointerenter'].forEach(ev => boostBtn.addEventListener(ev, () => input.boost = true));
    ['pointerup','pointercancel','pointerleave'].forEach(ev => boostBtn.addEventListener(ev, () => input.boost = false));

    // Gameplay
    const state = {
      t: 0,
      running: false,
      won: false,
      catchDistance: 1.6,
      wolfVel: new THREE.Vector3(),
      wolfFacing: 0,
      girlTarget: new THREE.Vector3(0, 0, -18),
      girlDir: new THREE.Vector3(0, 0, -1),
      nextTargetTime: 0
    };

    function pickGirlTarget() {
      const r = 26 + Math.random() * 18;
      const a = Math.random() * Math.PI * 2;
      state.girlTarget.set(Math.cos(a) * r, 0, Math.sin(a) * r);
      state.nextTargetTime = state.t + 2.4 + Math.random() * 1.8;
    }
    pickGirlTarget();

    const camOffset = new THREE.Vector3(0, 4.4, 8.8);
    const camLook = new THREE.Vector3();

    function clampWorld(v) {
      const m = 105;
      v.x = THREE.MathUtils.clamp(v.x, -m, m);
      v.z = THREE.MathUtils.clamp(v.z, -m, m);
    }

    const clock = new THREE.Clock();
    function loop() {
      const dt = Math.min(0.032, clock.getDelta());
      if (!state.running) {
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
        return;
      }
      state.t += dt;

      // input combined
      const kx = (keys['ArrowRight'] || keys['KeyD'] ? 1 : 0) - (keys['ArrowLeft'] || keys['KeyA'] ? 1 : 0);
      const ky = (keys['ArrowDown'] || keys['KeyS'] ? 1 : 0) - (keys['ArrowUp'] || keys['KeyW'] ? 1 : 0);
      const dirX = THREE.MathUtils.clamp(input.x + kx, -1, 1);
      const dirY = THREE.MathUtils.clamp(input.y + ky, -1, 1);

      const move = new THREE.Vector3(dirX, 0, dirY);
      const boost = input.boost || keys['ShiftLeft'] || keys['ShiftRight'];
      const targetSpeed = state.won ? 0 : (boost ? 9.5 : 6.4);

      if (move.lengthSq() > 0.0001) {
        move.normalize();
        state.wolfVel.lerp(move.multiplyScalar(targetSpeed), 0.16);
        state.wolfFacing = Math.atan2(state.wolfVel.x, state.wolfVel.z);
      } else {
        state.wolfVel.multiplyScalar(0.86);
      }

      wolf.position.addScaledVector(state.wolfVel, dt);
      clampWorld(wolf.position);
      wolf.position.y = 0.86 + Math.sin(state.t * 11) * Math.min(0.06, state.wolfVel.length() * 0.004);
      wolf.rotation.y = state.wolfFacing;
      wolfAura.position.set(wolf.position.x, 1.7, wolf.position.z);

      // IA fille
      if (!state.won) {
        const toWolf = new THREE.Vector3().subVectors(wolf.position, girl.position);
        const d = toWolf.length();

        if (d < 16) {
          // Fuite prioritaire opposée au loup
          toWolf.normalize().multiplyScalar(-1);
          state.girlDir.lerp(toWolf, 0.12);
        } else {
          if (state.t > state.nextTargetTime || girl.position.distanceTo(state.girlTarget) < 2.8) pickGirlTarget();
          const tdir = new THREE.Vector3().subVectors(state.girlTarget, girl.position).normalize();
          state.girlDir.lerp(tdir, 0.04);
        }

        const girlSpeed = THREE.MathUtils.clamp(4.9 + (16 - Math.min(d, 16)) * 0.2, 4.9, 8);
        girl.position.addScaledVector(state.girlDir.clone().normalize(), girlSpeed * dt);
        clampWorld(girl.position);
        girl.rotation.y = Math.atan2(state.girlDir.x, state.girlDir.z);
        girl.position.y = Math.sin(state.t * 9) * 0.04;

        if (d < state.catchDistance) {
          state.won = true;
          msgEl.innerHTML = '✅ Attrapée !<br><button id="again" class="badge" style="pointer-events:auto;margin-top:8px;cursor:pointer;">Rejouer</button>';
          setTimeout(() => {
            const again = document.getElementById('again');
            if (again) {
              again.addEventListener('click', () => {
                state.won = false;
                state.t = 0;
                wolf.position.set(0, 0.86, 0);
                state.wolfVel.set(0, 0, 0);
                girl.position.set(0, 0, -18);
                pickGirlTarget();
                msgEl.textContent = 'Chasse la fille au chaperon rouge dans la forêt enchantée.';
              }, { once: true });
            }
          }, 0);
        }
      }

      // HUD
      const dist = wolf.position.distanceTo(girl.position);
      distEl.textContent = `Distance: ${dist.toFixed(1)} m`;
      speedEl.textContent = `Vitesse: ${(state.wolfVel.length() * 3.6).toFixed(0)} km/h`;
      timerEl.textContent = `Temps: ${state.t.toFixed(1)}s`;
      if (!state.won) {
        if (dist < 4.2) msgEl.textContent = 'Presque ! Continue de sprinter.';
        else if (dist < 9) msgEl.textContent = 'Tu te rapproches, garde la ligne !';
      }

      // Caméra cinéma
      const back = new THREE.Vector3(Math.sin(state.wolfFacing), 0, Math.cos(state.wolfFacing)).multiplyScalar(-camOffset.z);
      const desired = new THREE.Vector3(wolf.position.x, 0, wolf.position.z).add(back);
      desired.y = camOffset.y;
      camera.position.lerp(desired, 0.09);
      camLook.set(wolf.position.x, 1.2, wolf.position.z - 1.8);
      camera.lookAt(camLook);

      // ambiance vivante
      stars.rotation.y += dt * 0.003;
      fireflies.forEach((f, i) => {
        const u = f.userData;
        f.position.y += Math.sin(state.t * u.speed + u.phase + i * 0.3) * dt * 0.35;
        f.position.x += Math.cos(state.t * u.drift + u.phase) * dt * 0.3;
        f.position.z += Math.sin(state.t * (u.drift + 0.15) + u.phase) * dt * 0.3;
      });

      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    loop();

    startBtn.addEventListener('click', () => {
      state.running = true;
      startScreen.style.display = 'none';
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
    });
  </script>
</body>
</html>
