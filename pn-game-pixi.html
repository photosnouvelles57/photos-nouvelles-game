<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Photos Nouvelles — Le Chasseur d'Images</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}
#game-container{width:100%;height:100%;display:flex;justify-content:center;align-items:center;position:relative}
canvas{display:block}
.btn{position:absolute;width:76px;height:76px;background:rgba(255,215,0,.08);
  border:2px solid rgba(255,215,0,.35);border-radius:20px;color:#ffd700;font-size:28px;
  display:flex;align-items:center;justify-content:center;user-select:none;
  -webkit-tap-highlight-color:transparent;cursor:pointer;z-index:10;
  backdrop-filter:blur(4px);transition:all .06s;}
.btn:active,.btn.on{background:rgba(255,215,0,.25);box-shadow:0 0 24px rgba(255,215,0,.3),inset 0 0 12px rgba(255,215,0,.1);}
#bL{bottom:95px;left:14px}#bR{bottom:95px;left:104px}
#bJ{bottom:95px;right:14px;border-color:rgba(120,200,255,.4);color:#aaddff}

#hud{position:absolute;top:0;left:0;width:100%;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="cv"></canvas>
  <div class="btn" id="bL">◀</div>

<script>
'use strict';

// ══════════════════════════════════════════════
//  INIT PIXI — WebGL GPU rendering
// ══════════════════════════════════════════════
const W=900,H=506;
const app = new PIXI.Application({
  width:W, height:H,
  backgroundColor:0x000000,
  antialias:false,
  resolution:1,
  autoDensity:true,
  view: document.getElementById('cv')
});

function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  app.view.style.width=s*W+'px';
  app.view.style.height=s*H+'px';
}
resize();
window.addEventListener('resize',resize);

const stage = app.stage;

// ══════════════════════════════════════════════
//  LAYERS (ordre de rendu)
// ══════════════════════════════════════════════
const layerBG      = new PIXI.Container(); // ciel, étoiles, lune
const layerMounts  = new PIXI.Container(); // montagnes
const layerCity    = new PIXI.Container(); // bâtiments
const layerClouds  = new PIXI.Container(); // nuages
const layerWorld   = new PIXI.Container(); // plateformes
const layerItems   = new PIXI.Container(); // caméras collectibles
const layerEnemies = new PIXI.Container(); // ennemis
const layerPlayer  = new PIXI.Container(); // joueur
const layerFX      = new PIXI.Container(); // particules, textes
const layerLight   = new PIXI.Container(); // lumières additives
const layerHUD     = new PIXI.Container(); // interface

[layerBG,layerMounts,layerCity,layerClouds,layerWorld,
 layerItems,layerEnemies,layerPlayer,layerFX,layerLight,layerHUD]
.forEach(l=>stage.addChild(l));

layerLight.blendMode = PIXI.BLEND_MODES.ADD;

// ══════════════════════════════════════════════
//  AUDIO (identique à la version HTML5)
// ══════════════════════════════════════════════
let AC=null,musOn=false,musTmr=null;
let mIdx=0,mNext=0,bIdx=0,bNext=0,hIdx=0,hNext=0,pIdx=0,pNext=0;

function hz(n,o=4){const s={C:0,Cs:1,D:2,Ds:3,E:4,F:5,Fs:6,G:7,Gs:8,A:9,As:10,B:11};return 440*Math.pow(2,(s[n]+(o-4)*12-9)/12);}
const N={G2:hz('G',2),A2:hz('A',2),B2:hz('B',2),C3:hz('C',3),D3:hz('D',3),E3:hz('E',3),F3:hz('F',3),Fs3:hz('Fs',3),G3:hz('G',3),A3:hz('A',3),B3:hz('B',3),C4:hz('C',4),D4:hz('D',4),E4:hz('E',4),F4:hz('F',4),Fs4:hz('Fs',4),G4:hz('G',4),Gs4:hz('Gs',4),A4:hz('A',4),As4:hz('As',4),B4:hz('B',4),C5:hz('C',5),D5:hz('D',5),E5:hz('E',5),F5:hz('F',5),Fs5:hz('Fs',5),G5:hz('G',5),A5:hz('A',5),C6:hz('C',6),D6:hz('D',6),E6:hz('E',6),G6:hz('G',6)};const __=0;
const MELODY=[[N.E5,.25],[N.E5,.25],[__,.25],[N.E5,.25],[__,.25],[N.C5,.25],[N.E5,.5],[N.G5,1],[__,.5],[N.G4,.5],[N.C5,.75],[__,.25],[N.G4,.5],[__,.5],[N.E4,.75],[__,.25],[N.A4,.5],[N.B4,.25],[N.As4,.25],[N.A4,.5],[N.G4,.33],[N.E5,.34],[N.G5,.33],[N.A5,.5],[N.F5,.25],[N.G5,.25],[N.E5,.5],[N.C5,.25],[N.D5,.25],[N.B4,1],[__,.5],[N.G5,.25],[N.Fs5,.25],[N.F5,.25],[N.D5,.5],[N.E5,.25],[__,.25],[N.Gs4,.25],[N.A4,.25],[N.C5,.5],[__,.25],[N.A4,.25],[N.C5,.25],[N.D5,.25],[N.G5,.25],[N.Fs5,.25],[N.F5,.25],[N.D5,.5],[N.E5,.25],[__,.25],[N.C6,.5],[N.C6,.25],[N.C6,.75],[N.G5,.25],[N.Fs5,.25],[N.F5,.25],[N.D5,.5],[N.E5,.25],[__,.25],[N.Gs4,.25],[N.A4,.25],[N.C5,.5],[__,.25],[N.A4,.25],[N.C5,.25],[N.D5,.25],[N.D5,.5],[__,.25],[N.D5,.5],[__,.25],[N.C5,1]];
const BASS=[[N.C3,.5],[N.C3,.5],[N.G2,.5],[N.G2,.5],[N.A2,.5],[N.A2,.5],[N.F3,.5],[N.F3,.5],[N.C3,.5],[N.G3,.5],[N.A2,.5],[N.F3,.5],[N.C3,.5],[N.G3,.5],[N.A2,.5],[N.B2,.5],[N.C3,.5],[N.G3,.5],[N.A2,.5],[N.F3,.5],[N.C3,.5],[N.G3,.5],[N.Fs3,.5],[N.F3,.5],[N.E3,.5],[N.G3,.5],[N.C3,.5],[N.G3,.5],[N.C3,1],[N.G2,1]];
const HARM=[[N.E5,.25],[N.G5,.25],[N.C6,.25],[N.G5,.25],[N.E5,.25],[N.G5,.25],[N.B5,.25],[N.G5,.25],[N.G5,.25],[N.B5,.25],[N.D6,.25],[N.B5,.25],[N.C6,.25],[N.E6,.25],[N.G6,.25],[N.E6,.25]];
const BPM=152,BD=60/BPM;

function osc(f,t,d,type,vol){if(!AC||!f)return;try{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d*.88);o.start(t);o.stop(t+d);}catch(e){}}
function oscEcho(f,t,d,type,vol){osc(f,t,d,type,vol);osc(f,t+.11,d*.8,type,vol*.25);osc(f,t+.22,d*.6,type,vol*.09);}
function noiseHit(t,vol,fq,hi,d){if(!AC)return;try{const n=AC.sampleRate*.12|0,b=AC.createBuffer(1,n,AC.sampleRate),dat=b.getChannelData(0);for(let i=0;i<n;i++)dat[i]=Math.random()*2-1;const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type=hi?'highpass':'bandpass';f.frequency.value=fq;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.start(t);s.stop(t+d);}catch(e){}}
function kick(t){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='sine';o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(38,t+.13);g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.start(t);o.stop(t+.17);}catch(e){}}
function snare(t){noiseHit(t,.15,2600,false,.1);}
function hihat(t,v=.042){noiseHit(t,v,9000,true,.03);}
function clap(t){for(let i=0;i<3;i++)noiseHit(t+i*.007,.055,1100,false,.055+i*.01);}
function schedMel(){if(!AC||!musOn)return;while(mNext<AC.currentTime+.28){const[f,dur]=MELODY[mIdx%MELODY.length],d=dur*BD;if(f){oscEcho(f,mNext,d*.85,'square',.062);osc(f*2,mNext,d*.55,'square',.016);}mNext+=d;mIdx++;}}
function schedBass(){if(!AC||!musOn)return;while(bNext<AC.currentTime+.28){const[f,dur]=BASS[bIdx%BASS.length],d=dur*BD;if(f){osc(f,bNext,d*.82,'sawtooth',.046);osc(f*2,bNext,d*.38,'triangle',.016);}bNext+=d;bIdx++;}}
function schedHarm(){if(!AC||!musOn)return;while(hNext<AC.currentTime+.28){const[f,dur]=HARM[hIdx%HARM.length],d=dur*BD;if(f)osc(f,hNext,d*.5,'triangle',.022);hNext+=d;hIdx++;}}
function schedPerc(){if(!AC||!musOn)return;const hb=BD*.5;while(pNext<AC.currentTime+.3){const b=pIdx%8;if(b===0){kick(pNext);hihat(pNext,.022);}else if(b===4){kick(pNext);clap(pNext+.01);}else if(b===2||b===6){snare(pNext);}else hihat(pNext);pNext+=hb;pIdx++;}}
function startMus(){if(!AC||musOn)return;musOn=true;const t=AC.currentTime+.06;mNext=t;bNext=t;hNext=t;pNext=t;if(musTmr)clearInterval(musTmr);musTmr=setInterval(()=>{schedMel();schedBass();schedHarm();schedPerc();},35);}
function stopMus(){musOn=false;if(musTmr){clearInterval(musTmr);musTmr=null;}}
function initAudio(){if(AC){AC.state==='suspended'?AC.resume().then(()=>{if(!musOn)startMus();}):(!musOn&&startMus());return;}try{AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume().then(()=>startMus());}catch(e){}}
function sfxJump(){if(!AC)return;const t=AC.currentTime;osc(N.C4,t,.05,'square',.11);osc(N.G4,t+.05,.08,'square',.08);}
function sfxCollect(){if(!AC)return;const t=AC.currentTime;[N.G5,N.B5,N.D6,N.G6].forEach((f,i)=>{osc(f,t+i*.05,.12,'square',.085);osc(f*1.5,t+i*.05,.07,'triangle',.028);});}
function sfxStomp(){if(!AC)return;const t=AC.currentTime;osc(N.G5,t,.03,'square',.17);osc(N.G4,t+.03,.04,'square',.11);kick(t+.01);noiseHit(t,.1,900,false,.07);}
function sfxDie(){stopMus();if(!AC)return;const t=AC.currentTime;[N.B4,N.B3,N.B2,N.A2,N.G2].forEach((f,i)=>osc(f,t+i*.1,.14,'square',.095));}
function sfxWin(){stopMus();if(!AC)return;const t=AC.currentTime;let tt=t;[[N.G5,.15],[N.C6,.15],[N.E6,.15],[N.G6,.3],[__,.1],[N.G6,.15],[N.E6,.15],[N.G6,.5]].forEach(([f,d])=>{if(f){osc(f,tt,d*.88,'square',.088);osc(f*1.5,tt,d*.55,'triangle',.032);}tt+=d*BD*1.2;});}
function sfxHurt(){if(!AC)return;const t=AC.currentTime;noiseHit(t,.18,400,false,.18);osc(N.As4,t,.05,'square',.11);}

// Texture de lumière radiale (pour effets de lumière additive)
function makeLightTexture(radius, r, g, b){
  const c = document.createElement('canvas');
  c.width = c.height = radius*2;
  const ctx = c.getContext('2d');
  const grd = ctx.createRadialGradient(radius,radius,0,radius,radius,radius);
  grd.addColorStop(0,`rgba(${r},${g},${b},0.45)`);
  grd.addColorStop(0.4,`rgba(${r},${g},${b},0.18)`);
  grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,radius*2,radius*2);
  return PIXI.Texture.from(c);
}

const lightTexWarm = makeLightTexture(120, 255, 200, 80);
const lightTexBlue = makeLightTexture(80, 80, 160, 255);
const lightTexGold = makeLightTexture(60, 255, 215, 0);

// Texture étoile
function makeStarTexture(){
  const c=document.createElement('canvas');c.width=c.height=8;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fffae8';ctx.beginPath();ctx.arc(4,4,3,0,Math.PI*2);ctx.fill();
  return PIXI.Texture.from(c);
}
const starTex = makeStarTexture();

// Texture particule ronde
function makeParticleTex(col='#ffd700'){
  const c=document.createElement('canvas');c.width=c.height=16;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(8,8,0,8,8,8);
  g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,16,16);
  return PIXI.Texture.from(c);
}
const partTexGold = makeParticleTex('#ffd700');
const partTexRed  = makeParticleTex('#ff4444');
const partTexWhite= makeParticleTex('#ffffff');
const partTexBlue = makeParticleTex('#88ccff');

function drawPlayerGfx(g, fr, flip, inv, tick){
  g.clear();
  const alpha = (inv>0 && Math.floor(inv/4)%2===0) ? 0 : 1;
  if(alpha===0) return;

  // Ombre portée simulée (decalage + teinte sombre)
  g.beginFill(0x001133, 0.3);
  g.drawEllipse(16, 46, 12, 4);
  g.endFill();

  // Chaussures
  g.beginFill(0x2a1000); g.drawRoundedRect(flip?20:2, 40, 10, 6, 2); g.endFill();
  g.beginFill(0x2a1000); g.drawRoundedRect(flip?4:18, 40, 10, 6, 2); g.endFill();

  // Jambes (pantalon bleu)
  const [ly,ry] = fr===2?[0,3]:fr===4?[1,1]:fr===6?[3,0]:[0,0];
  g.beginFill(0x3a4ecc); g.drawRect(flip?20:4, 28+ly, 10, 14); g.endFill();
  g.beginFill(0x3a4ecc); g.drawRect(flip?4:18, 28+ry, 10, 14); g.endFill();
  g.beginFill(0x2233aa); g.drawRect(flip?20:4, 28+ly, 10, 4); g.endFill();
  g.beginFill(0x2233aa); g.drawRect(flip?4:18, 28+ry, 10, 4); g.endFill();

  // Ceinture
  g.beginFill(0x2233aa); g.drawRect(2, 27, 28, 4); g.endFill();
  g.beginFill(0x5566cc); g.drawRect(2, 27, 28, 2); g.endFill();

  // Torse (chemise rouge)
  g.beginFill(0xcc3311); g.drawRoundedRect(6, 16, 20, 12, 3); g.endFill();
  g.beginFill(0xee5533); g.drawRect(6, 16, 20, 3); g.endFill();

  // Bretelles salopette
  g.beginFill(0x3a4ecc); g.drawRect(6, 16, 6, 12); g.endFill();
  g.beginFill(0x3a4ecc); g.drawRect(20, 16, 6, 12); g.endFill();
  g.beginFill(0x5566cc); g.drawRect(6, 16, 6, 2); g.endFill();
  g.beginFill(0x5566cc); g.drawRect(20, 16, 6, 2); g.endFill();

  // Boutons dorés
  g.beginFill(0xffd700); g.drawCircle(9, 19, 2); g.endFill();
  g.beginFill(0xffd700); g.drawCircle(23, 19, 2); g.endFill();

  // Bras gauche
  g.beginFill(0xcc3311); g.drawRect(0, 16, 6, 10); g.endFill();
  g.beginFill(0xf5c896); g.drawRoundedRect(0, 24, 6, 6, 2); g.endFill();

  // Mini caméra (main droite) — reflet bleu
  g.beginFill(0x0d0d22); g.drawRoundedRect(26, 18, 8, 7, 2); g.endFill();
  g.beginFill(0x1a1a3a); g.drawRoundedRect(27, 19, 6, 5, 1); g.endFill();
  g.beginFill(0x6699ff); g.drawCircle(30, 21, 2); g.endFill();
  g.beginFill(0xffffff, 0.7); g.drawCircle(29, 20, 0.8); g.endFill();
  g.beginFill(0xffd700); g.drawRect(26, 17, 3, 2); g.endFill(); // flash

  // Bras droit
  g.beginFill(0xcc3311); g.drawRect(26, 16, 6, 10); g.endFill();
  g.beginFill(0xf5c896); g.drawRoundedRect(26, 24, 6, 6, 2); g.endFill();

  // Cou
  g.beginFill(0xf5c896); g.drawRect(14, 12, 4, 6); g.endFill();

  // Tête
  g.beginFill(0xf5c896); g.drawRoundedRect(6, 4, 20, 14, 5); g.endFill();
  g.beginFill(0xd4946a); g.drawRect(6, 4, 20, 2); g.endFill();

  // Oreilles
  g.beginFill(0xf5c896); g.drawEllipse(5, 10, 2.5, 3.5); g.endFill();
  g.beginFill(0xf5c896); g.drawEllipse(27, 10, 2.5, 3.5); g.endFill();

  // Joues rosées
  g.beginFill(0xe08878, 0.6); g.drawEllipse(9, 15, 3, 2); g.endFill();
  g.beginFill(0xe08878, 0.6); g.drawEllipse(23, 15, 3, 2); g.endFill();

  // Yeux

const platGraphics = [];

function buildPlatforms(plats){
  // Nettoyer
  platGraphics.forEach(g=>layerWorld.removeChild(g));
  platGraphics.length=0;

  for(const pl of plats){
    const g = new PIXI.Graphics();
    if(pl.t==='g'){
      // Sol herbeux
      g.beginFill(0x267520); g.drawRect(0,0,pl.w,pl.h); g.endFill();
      g.beginFill(0x3aaa28); g.drawRect(0,0,pl.w,8); g.endFill();
      g.beginFill(0x55dd44); g.drawRect(0,0,pl.w,3); g.endFill();
      // Terre
      g.beginFill(0x3c1c06); g.drawRect(0,8,pl.w,pl.h-8); g.endFill();
      g.beginFill(0x5a2e0c); g.drawRect(0,8,pl.w,6); g.endFill();
      // Grille terre
      for(let tx=0;tx<pl.w;tx+=22){g.lineStyle(0.5,0x000000,0.08);g.moveTo(tx,8);g.lineTo(tx,pl.h);}
      for(let ty=20;ty<pl.h;ty+=13){g.lineStyle(0.5,0x000000,0.08);g.moveTo(0,ty);g.lineTo(pl.w,ty);}
      g.lineStyle(0);
      // Champignons
      for(let fx=40;fx<pl.w-30;fx+=110){
        g.beginFill(0xcc3311); g.drawEllipse(fx, -3, 7, 5); g.endFill();
        g.beginFill(0xffffff,0.5); g.drawCircle(fx-2,-5,1.5); g.endFill();
        g.beginFill(0xf0c060); g.drawRect(fx-3,0,6,3); g.endFill();
      }
    } else if(pl.t==='b'){
      // Briques
      g.beginFill(0x7a3414); g.drawRoundedRect(0,0,pl.w,pl.h,2); g.endFill();
      const bh=pl.h, bw=18;
      for(let row=0;row*bh<=bh;row++){
        const off=row%2?bw/2:0;
        for(let col=-1;col*bw<pl.w+bw;col++){
          const bx=col*bw-off, by=row*bh;
          g.beginFill(row%2?0x8a4018:0x7a3414); g.drawRect(bx+1,by+1,bw-2,bh-2); g.endFill();
          g.beginFill(0xffc88a,0.08); g.drawRect(bx+1,by+1,bw-2,3); g.endFill();
        }
      }
      g.beginFill(0xffb464,0.12); g.drawRect(0,0,pl.w,2); g.endFill();
      g.lineStyle(1,0xffd700,0.2); g.drawRoundedRect(0,0,pl.w,pl.h,2); g.lineStyle(0);
    } else {
      // Or
      g.beginFill(0xc8960a); g.drawRoundedRect(0,0,pl.w,pl.h,3); g.endFill();
      g.beginFill(0xffd700); g.drawRoundedRect(0,0,pl.w,pl.h,3); g.endFill();
      g.beginFill(0xffe840); g.drawRoundedRect(1,1,pl.w-2,pl.h/2,2); g.endFill();
      g.beginFill(0xffffff,0.3); g.drawRoundedRect(2,1,pl.w-4,3,1); g.endFill();
      for(let gx=0;gx<pl.w;gx+=14){g.lineStyle(0.5,0x000000,0.1);g.moveTo(gx,0);g.lineTo(gx,pl.h);}
      g.lineStyle(0);
      // Glow
      g.lineStyle(2,0xffd700,0.6); g.drawRoundedRect(0,0,pl.w,pl.h,3); g.lineStyle(0);
    }
    g.x = pl.x;
    g.y = pl.y;
    layerWorld.addChild(g);
    platGraphics.push(g);
  }
}

function spawnParticle(x, y, col, n=14, sp=3.5){
  const tex = col==='gold'?partTexGold:col==='red'?partTexRed:col==='blue'?partTexBlue:partTexWhite;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+Math.random()*.3, s=sp*.5+Math.random()*sp;
    const spr = new PIXI.Sprite(tex);
    spr.anchor.set(0.5);
    spr.x=x; spr.y=y;
    spr._vx=Math.cos(a)*s; spr._vy=Math.sin(a)*s-2;
    spr._life=28+Math.random()*22; spr._maxLife=spr._life;
    spr.scale.set(0.3+Math.random()*0.5);
    layerFX.addChild(spr);
    parts.push({spr, type:'dot'});
  }
}

function spawnText(x, y, txt, col=0xffd700){
  const t = new PIXI.Text(txt, {
    fontFamily:'Georgia,serif', fontSize:14, fontWeight:'bold',
    fill:col, stroke:0x000000, strokeThickness:3
  });
  t.anchor.set(0.5);
  t.x=x; t.y=y;
  t._vy=-2; t._life=62; t._maxLife=62;
  layerFX.addChild(t);
  parts.push({spr:t, type:'txt'});
}

function spawnGoldBurst(x, y){
  spawnParticle(x,y,'gold',24,5);
  spawnText(x,y,'PN ★',0xffd700);
  // Flash lumière
  const l = new PIXI.Sprite(lightTexGold);
  l.anchor.set(0.5); l.x=x; l.y=y; l.alpha=1; l._life=18; l._maxLife=18;
  layerLight.addChild(l);
  parts.push({spr:l, type:'light'});
}

function updateParticles(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.spr._life--;
    const ratio = p.spr._life / p.spr._maxLife;
    if(p.type==='dot'){p.spr.x+=p.spr._vx; p.spr.y+=p.spr._vy; p.spr._vy+=0.18; p.spr.alpha=ratio;}
    else if(p.type==='txt'){p.spr.y+=p.spr._vy; p.spr.alpha=ratio; p.spr.scale.set(0.8+0.4*(1-ratio));}
    else if(p.type==='light'){p.spr.alpha=ratio*1.2; p.spr.scale.set(1+2*(1-ratio));}
    if(p.spr._life<=0){
      p.spr.parent && p.spr.parent.removeChild(p.spr);
      parts.splice(i,1);
    }
  }
}

    // Gradient barre
    hudBar.beginFill(0xff9900); hudBar.drawRoundedRect(bx,by,bw*pg,bh,4); hudBar.endFill();
    hudBar.beginFill(0xffee20); hudBar.drawRoundedRect(bx,by,bw*pg,4,4); hudBar.endFill();
    hudBar.beginFill(0xffffff,0.25); hudBar.drawRoundedRect(bx,by,bw*pg,3,4); hudBar.endFill();
  }
  hudBar.lineStyle(1.5,0xffd700,0.55); hudBar.drawRoundedRect(bx-1,by-1,bw+2,bh+2,5); hudBar.lineStyle(0);

  // Dots caméras collectées
  hudCamDots.clear();
  if(cams){
    const dx=W/2-cams.length*11;
    cams.forEach((c,i)=>{
      if(c.col){
        hudCamDots.beginFill(0xffd700); hudCamDots.drawCircle(dx+i*22+11,by+bh+16,5.5); hudCamDots.endFill();
        hudCamDots.beginFill(0xffffff,0.4); hudCamDots.drawCircle(dx+i*22+10,by+bh+15,2); hudCamDots.endFill();
      } else {
        hudCamDots.beginFill(0xb48c00,0.25); hudCamDots.drawCircle(dx+i*22+11,by+bh+16,5.5); hudCamDots.endFill();
      }
    });
  }
}

//  INPUT
// ══════════════════════════════════════════════
const IN={L:false,R:false,J:false};
let tL=false,tR=false,tJ=false,pJ=false;

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','q','a'].includes(e.key))IN.L=true;
  if(['ArrowRight','d'].includes(e.key))IN.R=true;
  if([' ','ArrowUp','w','z'].includes(e.key))IN.J=true;
  if([' ','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
},{passive:false});
document.addEventListener('keyup',e=>{
  if(['ArrowLeft','q','a'].includes(e.key))IN.L=false;
  if(['ArrowRight','d'].includes(e.key))IN.R=false;
  if([' ','ArrowUp','w','z'].includes(e.key))IN.J=false;
});

function mkBtn(id,onD,onU){
  const el=document.getElementById(id);
  const d=e=>{e.preventDefault();e.stopPropagation();onD();el.classList.add('on');};
  const u=e=>{e.preventDefault();onU();el.classList.remove('on');};
  el.addEventListener('touchstart',d,{passive:false});
  el.addEventListener('touchend',u,{passive:false});
  el.addEventListener('touchcancel',u,{passive:false});
  el.addEventListener('mousedown',()=>{onD();el.classList.add('on');});
  el.addEventListener('mouseup',()=>{onU();el.classList.remove('on');});
  el.addEventListener('mouseleave',()=>{onU();el.classList.remove('on');});
}

function goGame(){initAudio();if(gs!=='play')reset();}
mkBtn('bL',()=>{if(gs!=='play'){goGame();return;}tL=true;},()=>tL=false);
mkBtn('bR',()=>{if(gs!=='play'){goGame();return;}tR=true;},()=>tR=false);
mkBtn('bJ',()=>{if(gs!=='play'){goGame();return;}tJ=true;},()=>tJ=false);
app.view.addEventListener('click',goGame);
app.view.addEventListener('touchstart',e=>{e.preventDefault();goGame();},{passive:false});

//  RESET
// ══════════════════════════════════════════════
function reset(){
  plats=mkPlats(); cams=mkCams(); enemies=mkEnemies();
  parts.forEach(p=>p.spr.parent&&p.spr.parent.removeChild(p.spr));
  parts=[];
  scrollX=0; score=0; lives=3; tick=0;
  PL.x=90;PL.y=380;PL.vx=0;PL.vy=0;PL.gnd=false;PL.face=1;PL.fr=0;PL.ft=0;PL.dead=false;PL.dT=0;PL.inv=0;
  buildPlatforms(plats);
  buildCamSprites();
  buildEnemySprites();
  hideOverlay();
  gs='play';
}

// ══════════════════════════════════════════════
//  UPDATE
// ══════════════════════════════════════════════
function update(delta){
  tick++;

  if(gs==='start'){
    // Blink texte
    overlayText4.text = Math.floor(tick/28)%2===0 ? '▶  APPUYER POUR COMMENCER  ◀' : '';
    return;
  }
  if(gs==='win'||gs==='over'){
    overlayText4.text = Math.floor(tick/28)%2===0 ? '▶  REJOUER  ◀' : '';
    if(gs==='win'){ spawnParticle(Math.random()*W+scrollX, Math.random()*H*0.4, 'gold', 4, 2.5); }
    updateParticles();
    return;
  }

  // --- PLAY ---
  const gL=IN.L||tL, gR=IN.R||tR, gJ=IN.J||tJ;
  const jst=gJ&&!pJ; pJ=gJ;

  if(PL.dead){
    PL.dT--;
    updateParticles();
    if(PL.dT<=0){
      lives--;
      if(lives<=0){gs='over';showOver();return;}
      PL.x=Math.max(90,scrollX+60);PL.y=200;
      PL.vx=0;PL.vy=0;PL.gnd=false;PL.dead=false;PL.inv=100;
      if(AC)startMus();
    }
    return;
  }
  if(PL.inv>0)PL.inv--;

  const spd=5.2;
  if(gL){PL.vx+=((-spd)-PL.vx)*.26;PL.face=-1;}
  else if(gR){PL.vx+=((spd)-PL.vx)*.26;PL.face=1;}
  else PL.vx*=PL.gnd?.56:.88;

  if(jst&&PL.gnd){PL.vy=-17.5;PL.gnd=false;sfxJump();}
  PL.vy=Math.min(PL.vy+0.62,18);
  PL.x+=PL.vx; PL.y+=PL.vy;
  PL.x=Math.max(30,Math.min(LW-30-PW,PL.x));
  PL.gnd=false;

  for(const pl of plats){
    if(PL.x+PW<=pl.x||PL.x>=pl.x+pl.w)continue;
    if(PL.y+PH<=pl.y||PL.y>=pl.y+pl.h)continue;
    const pb=PL.y+PH-PL.vy;
    if(pb<=pl.y+6&&PL.vy>=0){PL.y=pl.y-PH;PL.vy=0;PL.gnd=true;}
    else if(PL.y-PL.vy>=pl.y+pl.h-3&&PL.vy<0){PL.y=pl.y+pl.h;PL.vy=2;}
    else{PL.vx>0?PL.x=pl.x-PW:PL.x=pl.x+pl.w;PL.vx=0;}
  }

  if(PL.y>H+120){PL.dead=true;PL.dT=62;sfxDie();spawnParticle(PL.x+PW/2,H-20,'red',18);updateParticles();return;}

  // Scroll
  scrollX+=(PL.x-scrollX-W*0.33)*0.1;
  scrollX=Math.max(0,Math.min(LW-W,scrollX));

  // Collecte caméras
  for(let i=0;i<cams.length;i++){
    const c=cams[i]; if(c.col)continue;
    if(PL.x+PW>c.x&&PL.x<c.x+CW&&PL.y+PH>c.y&&PL.y<c.y+CH+14){
      c.col=true; score++;
      sfxCollect();
      spawnGoldBurst(c.x+CW/2-scrollX, c.y+CH/2);
      camGraphics[i].visible=false;
      camLights[i].visible=false;
      camLabels[i].visible=false;
      if(score>=cams.length) setTimeout(()=>{gs='win';sfxWin();showWin();},900);
    }
  }

  // Ennemis
  for(let i=0;i<enemies.length;i++){
    const en=enemies[i];
    if(en.stomped){
      en.stompT--;
      if(en.stompT<=0){en.alive=false;enemyGraphics[i].visible=false;enemyLights[i].visible=false;}
      else{
        const sc=en.stompT/40;
        enemyGraphics[i].scale.set(1.4+0.2*(1-sc), 0.15+0.15*sc);
        enemyGraphics[i].alpha=Math.min(1,sc+0.3);
      }
      continue;
    }
    if(!en.alive)continue;

    if(++en.ft>=9){en.ft=0;en.fr=(en.fr+1)%3;}
    en.x+=en.vx;
    if(en.x<=en.pl){en.x=en.pl;en.vx=Math.abs(en.vx);}
    if(en.x+EW>=en.pr){en.x=en.pr-EW;en.vx=-Math.abs(en.vx);}

    if(PL.inv<=0){
      const ox=PL.x+PW>en.x+2&&PL.x<en.x+EW-2;
      const oy=PL.y+PH>en.y+2&&PL.y<en.y+EH-2;
      if(ox&&oy){
        const pb=PL.y+PH-PL.vy;
        if(PL.vy>0&&pb<=en.y+EH*0.4){
          en.stomped=true;en.fr=3;en.stompT=40;sfxStomp();PL.vy=-11;PL.inv=12;
          spawnParticle(en.x+EW/2-scrollX, en.y+EH/2,'gold',18,4);
          spawnText(en.x+EW/2-scrollX, en.y,'STOMP !',0xff9900);
        }else{
          PL.dead=true;PL.dT=65;sfxHurt();sfxDie();
          spawnParticle(PL.x+PW/2-scrollX, PL.y+PH/2,'red',20);
        }
      }
    }
  }

  // Animation joueur
  if(!PL.gnd)PL.fr=4;
  else if(Math.abs(PL.vx)>1){if(++PL.ft>=6){PL.ft=0;PL.fr=PL.fr===1?2:PL.fr===2?3:1;}}
  else{PL.fr=0;PL.ft=0;}

  updateParticles();
}

// ══════════════════════════════════════════════
//  RENDU
// ══════════════════════════════════════════════
function renderBG(){
  // Lune
  moonGfx.clear();
  const mx=((680-scrollX*0.022)%W+W*2)%W;
  // Halo lune
  for(let r=80;r>20;r-=15){
    moonGfx.beginFill(0xfffae8, 0.015*(80-r)/80);
    moonGfx.drawCircle(mx,52,r); moonGfx.endFill();
  }
  moonGfx.beginFill(0xfffae8); moonGfx.drawCircle(mx,52,24); moonGfx.endFill();
  moonGfx.beginFill(0x010112); moonGfx.drawCircle(mx+7,45,19); moonGfx.endFill();
  // Cratères
  moonGfx.beginFill(0xf0ead0,0.15); moonGfx.drawCircle(mx-7,59,4); moonGfx.endFill();
  moonGfx.beginFill(0xf0ead0,0.12); moonGfx.drawCircle(mx+10,57,2.5); moonGfx.endFill();

  // Étoiles scintillantes
  stars.forEach(s=>{
    const sx=(((s.x-scrollX*0.06)%LW+LW)%LW)/LW*W;
    s.x_screen=sx; // position écran
    s.alpha=s._baseAlpha*(0.6+0.4*Math.sin(tick*s._speed+s._phase));
    s.position.x=sx;
  });

  // Montagnes
  mountGfx.clear();
  for(const m of MOUNTS){
    const mx2=((( m.x-scrollX*0.12)%LW+LW)%LW)/LW*W;
    // Corps
    mountGfx.beginFill(0x100e22); mountGfx.moveTo(mx2-m.w*0.52,H); mountGfx.lineTo(mx2,m.y); mountGfx.lineTo(mx2+m.w*0.52,H); mountGfx.closePath(); mountGfx.endFill();
    // Neige
    mountGfx.beginFill(0xc0caff,0.2); mountGfx.moveTo(mx2-m.w*0.1,m.y+m.h*0.2); mountGfx.lineTo(mx2,m.y); mountGfx.lineTo(mx2+m.w*0.1,m.y+m.h*0.2); mountGfx.closePath(); mountGfx.endFill();
    // Bordure lumineuse
    mountGfx.lineStyle(0.8,0x5060a0,0.2);
    mountGfx.moveTo(mx2-m.w*0.52,H); mountGfx.lineTo(mx2,m.y); mountGfx.lineTo(mx2+m.w*0.52,H);
    mountGfx.lineStyle(0);
  }

  // Bâtiments
  bldgGfx.clear();
  for(const b of BLDGS){
    const bsx=(((b.x-scrollX*0.25)%(LW*0.32)+LW*0.32)%(LW*0.32))/(LW*0.32)*W*1.14;
    const sx=(bsx-38)%W;
    bldgGfx.beginFill(0x02020c); bldgGfx.drawRect(sx,b.y,b.w,b.h); bldgGfx.endFill();
    bldgGfx.beginFill(0x050514); bldgGfx.drawRect(sx,b.y,b.w,3); bldgGfx.endFill();
    bldgGfx.lineStyle(0.6,0x4646a0,0.12); bldgGfx.drawRect(sx,b.y,b.w,b.h); bldgGfx.lineStyle(0);
    for(const[wx,wy,on] of b.wins){
      if(on){
        const wbr=0.08+0.1*Math.sin(tick*0.018+wx*1.4+b.x*0.01);
        bldgGfx.beginFill(0xffd264,wbr); bldgGfx.drawRect(sx+wx,b.y+wy,4,5); bldgGfx.endFill();
      }
    }
    if(b.w>38){
      bldgGfx.beginFill(0x464690,0.4); bldgGfx.drawRect(sx+b.w*0.5,b.y-10,1,11); bldgGfx.endFill();
      const ar=Math.sin(tick*0.05+b.x)*0.4+0.5;
      bldgGfx.beginFill(0xff4646,ar); bldgGfx.drawCircle(sx+b.w*0.5,b.y-11,2); bldgGfx.endFill();
    }
  }

  // Nuages
  cloudGfx.clear();
  for(const cl of CLOUDS){
    const cx2=((( cl.x-scrollX*0.18+tick*cl.sp)%(LW*0.45)+LW*0.45)%(LW*0.45))/(LW*0.45)*W*1.15;
    cloudGfx.beginFill(0x37387a,0.4); cloudGfx.drawEllipse(cx2,cl.y,cl.w*0.48,cl.h*0.48); cloudGfx.endFill();
    cloudGfx.beginFill(0x2d3269,0.3); cloudGfx.drawEllipse(cx2-cl.w*0.22,cl.y-cl.h*0.12,cl.w*0.26,cl.h*0.38); cloudGfx.endFill();
    cloudGfx.beginFill(0x2d3269,0.25); cloudGfx.drawEllipse(cx2+cl.w*0.2,cl.y-cl.h*0.1,cl.w*0.22,cl.h*0.34); cloudGfx.endFill();
  }
}

function renderWorld(){
  // Décaler les plateformes selon scroll
  platGraphics.forEach((g,i)=>{
    const pl=plats[i];
    g.x=pl.x-scrollX;
  });
}

function renderItems(){
  for(let i=0;i<cams.length;i++){
    const c=cams[i]; if(c.col)continue;
    const sx=c.x-scrollX;
    const fy=Math.sin(tick*0.078+c.id*1.1)*5;
    const rot=Math.sin(tick*0.042+c.id*0.8)*0.06;
    camGraphics[i].x=sx; camGraphics[i].y=c.y+fy; camGraphics[i].rotation=rot;
    drawCamGfx(camGraphics[i], tick, c.id);
    camLights[i].x=sx+CW/2; camLights[i].y=c.y+fy+CH/2;
    camLights[i].alpha=0.7+0.3*Math.sin(tick*0.1+c.id);
    camLights[i].scale.set(1+0.15*Math.sin(tick*0.08+c.id));
    camLabels[i].x=sx+CW/2; camLabels[i].y=c.y+fy+CH+4;
  }
}

function renderEnemies(){
  for(let i=0;i<enemies.length;i++){
    const en=enemies[i];
    if(!en.alive&&!en.stomped)continue;
    const sx=en.x-scrollX;
    if(sx+EW<-10||sx>W+10){enemyGraphics[i].visible=false;enemyLights[i].visible=false;continue;}
    enemyGraphics[i].visible=true;
    if(!en.stomped) enemyLights[i].visible=true;

    if(!en.stomped){
      enemyGraphics[i].scale.set(1);
      enemyGraphics[i].alpha=1;
    }
    enemyGraphics[i].x=sx; enemyGraphics[i].y=en.y;
    drawEnemyGfx(enemyGraphics[i], en.fr, en.stomped, tick);
    enemyLights[i].x=sx+EW/2; enemyLights[i].y=en.y+EH/2;
    enemyLights[i].alpha=0.2+0.1*Math.sin(tick*0.15+i);
  }
}

function renderPlayer(){
  if(PL.dead){playerGfx.clear();playerLight.visible=false;return;}
  if(PL.inv>0&&Math.floor(PL.inv/4)%2===0){playerGfx.clear();playerLight.visible=false;return;}

  const sx=PL.x-scrollX;

  // Squash & Stretch
  let scX=1,scY=1;
  if(!PL.gnd){
    if(PL.vy<-5){scX=0.88;scY=1.14;}
    else if(PL.vy>4){scX=1.12;scY=0.9;}
  } else if(Math.abs(PL.vx)>3){scX=1.06;scY=0.95;}

  // Shadow au sol
  const shadowDist=Math.max(0,(GY-(PL.y+PH))/80);
  playerGfx.clear();

  // Ombre
  if(shadowDist<1){
    const shadowY=Math.min(PL.y+PH,GY)-PL.y;
    playerGfx.beginFill(0x000000,0.3*(1-shadowDist));
    playerGfx.drawEllipse(PW/2,shadowY+5,PW*0.55*(1-shadowDist*0.6),4*(1-shadowDist*0.8));
    playerGfx.endFill();
  }

  playerGfx.x=sx; playerGfx.y=PL.y;
  playerGfx.scale.set(scX,scY);
  playerGfx.pivot.set(PW/2,PH);
  playerGfx.position.set(sx+PW/2,PL.y+PH);

  drawPlayerGfx(playerGfx, PL.fr, PL.face<0, PL.inv, tick);

  // Lumière autour du joueur
  playerLight.visible=true;
  playerLight.x=sx+PW/2; playerLight.y=PL.y+PH/2;
  playerLight.alpha=0.35+0.08*Math.sin(tick*0.05);
}

// ══════════════════════════════════════════════
//  BOUCLE PRINCIPALE
// ══════════════════════════════════════════════
app.ticker.add((delta)=>{
  update(delta);
  renderBG();
  renderWorld();
  renderItems();
  renderEnemies();
  renderPlayer();
  updateHUD();
});

plats=mkPlats(); cams=mkCams(); enemies=mkEnemies();
buildPlatforms(plats);
buildCamSprites();
buildEnemySprites();
showStart();
overlayText4.y=420;
